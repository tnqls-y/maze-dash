<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MAZE DASH</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Black+Han+Sans&display=swap" rel="stylesheet">
<style>
  :root { --bg:#0b0618; --card:#1a1033; --line:#3b2a6b; --text:#ede9fe; --muted:#a79bd1;
          --accent:#22d3ee; --pink:#e879f9; --me:#f97316; --pixel:"Press Start 2P","Black Han Sans",monospace; }
  * { box-sizing:border-box; }
  body { margin:0; color:var(--text); font-family:"Black Han Sans","Pretendard","Malgun Gothic",system-ui,sans-serif;
         background:radial-gradient(ellipse at top,#241346 0%,var(--bg) 60%) fixed; min-height:100vh; }
  .wrap { max-width:640px; margin:0 auto; padding:16px; text-align:center; }
  h1 { margin:10px 0 6px; font-family:var(--pixel); font-size:1.7rem; font-weight:400; letter-spacing:2px;
       background:linear-gradient(90deg,var(--accent),var(--pink)); -webkit-background-clip:text; background-clip:text; color:transparent;
       filter:drop-shadow(0 0 10px rgba(232,121,249,.45)); }
  .tag { font-family:var(--pixel); font-size:.62rem; color:var(--muted); margin:0 0 14px; line-height:1.8; }
  .ui { font-family:"Pretendard","Malgun Gothic",system-ui,sans-serif; }
  .quests { display:grid; grid-template-columns:repeat(5,1fr); gap:8px; max-width:520px; margin:0 auto 10px; }
  .qb { background:var(--card); border:2px solid var(--line); border-radius:10px; color:var(--text); padding:6px 0 5px; cursor:pointer;
        font-family:inherit; line-height:1.2; }
  .qb b { display:block; font-family:var(--pixel); font-weight:400; font-size:.8rem; margin-bottom:3px; }
  .qb small { font-size:.72rem; color:#facc15; letter-spacing:1px; }
  .qb.on { border-color:var(--accent); box-shadow:0 0 12px rgba(34,211,238,.5); }
  .qb.lock { opacity:.4; cursor:not-allowed; }
  .qb.dk b::after { content:" 🌙"; font-family:sans-serif; font-size:.7rem; }
  .qinfo { color:var(--muted); font-size:.95rem; margin:4px 0 10px; }
  .chk { display:inline-flex; align-items:center; gap:6px; color:var(--muted); font-size:.85rem; cursor:pointer; user-select:none; margin-bottom:10px; }
  .chk input { width:16px; height:16px; accent-color:var(--pink); }
  #cv { width:100%; max-width:560px; height:auto; image-rendering:pixelated; border-radius:12px; background:#000;
        border:3px solid var(--line); box-shadow:0 0 0 2px #120a26,0 0 28px rgba(167,139,250,.35); }
  .score { display:flex; justify-content:center; gap:26px; margin:12px 0 2px; font-size:1rem; color:var(--muted); flex-wrap:wrap; align-items:baseline; }
  .score b { color:var(--text); font-size:1.3rem; font-variant-numeric:tabular-nums; }
  .score .time b { font-family:var(--pixel); font-size:1.15rem; color:var(--accent); text-shadow:0 0 8px rgba(34,211,238,.6); }
  .score small { font-family:"Pretendard","Malgun Gothic",system-ui,sans-serif; }
  .best { color:var(--muted); font-size:.92rem; min-height:1.4em; }
  #status { min-height:2em; font-size:1.25rem; margin:6px 0 8px; }
  .btns { display:flex; justify-content:center; gap:10px; flex-wrap:wrap; }
  .big { border:0; border-radius:12px; padding:13px 40px; font-size:1.2rem; font-family:inherit; cursor:pointer;
         background:linear-gradient(135deg,var(--accent),var(--pink)); color:#10061f; box-shadow:0 4px 0 #6d28d9; }
  .big:active { transform:translateY(3px); box-shadow:0 1px 0 #6d28d9; }
  .big:disabled { opacity:.6; cursor:default; transform:none; }
  .big.alt { background:var(--card); color:var(--text); border:2px solid var(--line); box-shadow:0 4px 0 #120a26; }
  #nextBtn { display:none; }
  #reg { display:none; background:var(--card); border:2px solid var(--line); border-radius:14px; padding:14px; margin:14px auto 0; max-width:420px; }
  #reg.show { display:block; }
  #reg input { background:#0b0618; border:2px solid var(--line); color:var(--text); border-radius:8px; padding:9px 10px; font-size:1rem; width:150px; }
  #reg button { border:0; border-radius:8px; padding:10px 16px; background:var(--accent); color:#10061f; cursor:pointer; font-size:1rem; font-family:inherit; }
  #reg button:disabled { opacity:.5; }
  .keys { display:grid; grid-template-areas:". u ." "l d r"; grid-template-columns:repeat(3,66px); justify-content:center; gap:8px; margin:18px 0 4px; }
  .key { width:66px; padding:8px 0; background:var(--card); border:2px solid var(--line); border-bottom-width:5px; border-radius:12px; user-select:none; touch-action:none; cursor:pointer; }
  .key b { display:block; font-family:var(--pixel); font-size:1.15rem; font-weight:400; margin:4px 0; color:var(--accent); }
  .key span { font-size:.8rem; color:var(--muted); font-family:"Pretendard","Malgun Gothic",system-ui,sans-serif; }
  .key.press { transform:translateY(3px); border-bottom-width:2px; background:#261848; }
  .hint { color:var(--muted); font-size:.85rem; margin-top:6px; }
  a { color:var(--accent); text-decoration:none; font-size:1rem; }
  #confetti { position:fixed; left:0; top:0; width:100vw; height:100vh; pointer-events:none; z-index:10; }
</style>
</head>
<body>
<canvas id="confetti"></canvas>
<div class="wrap">
  <h1>MAZE DASH</h1>
  <p class="tag">ESCAPE THE MAZE · BEAT THE CLOCK</p>

  <div class="quests" id="quests"></div>
  <div class="qinfo ui" id="qinfo"></div>
  <label class="chk ui"><input type="checkbox" id="demo"> 🔓 Demo (모든 퀘스트 열기)</label>

  <canvas id="cv"></canvas>

  <div class="score">
    <span class="time">⏱ <b id="timer">0.00</b> sec</span>
    <span>🟠 이동 <b id="myMoves">0</b>칸 <small id="shortest"></small></span>
  </div>
  <div class="best ui" id="goal"></div>
  <div class="best ui" id="best"></div>
  <div id="status"></div>
  <div class="btns">
    <button class="big" id="startBtn">START</button>
    <button class="big alt" id="nextBtn">NEXT ▶</button>
  </div>

  <div id="reg" class="ui">
    <div style="margin-bottom:8px">🏆 랭킹에 기록을 남겨요</div>
    <input id="nick" maxlength="10" placeholder="닉네임" autocomplete="off">
    <button id="regBtn">기록 등록</button>
    <div id="regMsg" class="hint"></div>
  </div>

  <div class="keys">
    <div class="key" style="grid-area:u" data-code="ArrowUp" data-dx="0" data-dy="-1"><b>↑</b></div>
    <div class="key" style="grid-area:l" data-code="ArrowLeft" data-dx="-1" data-dy="0"><b>←</b></div>
    <div class="key" style="grid-area:d" data-code="ArrowDown" data-dx="0" data-dy="1"><b>↓</b></div>
    <div class="key" style="grid-area:r" data-code="ArrowRight" data-dx="1" data-dy="0"><b>→</b></div>
  </div>
  <div class="hint ui">키보드 방향키 ← ↑ ↓ → · <b>Enter</b>로 시작 · 폰은 위 버튼을 누르세요</div>
  <p class="ui"><a href="/stats">🏆 랭킹 보기 →</a> &nbsp;·&nbsp; <a href="#" id="resetBtn" style="color:var(--muted)">↺ 내 진행 초기화</a></p>
</div>

<script>
/* ---------- 퀘스트 10개 (미로는 시드로 고정 → 모두가 같은 미로) ---------- */
const QUESTS = [
  { n: 11, dark: false, seed: 1101 }, { n: 13, dark: false, seed: 1302 }, { n: 15, dark: false, seed: 1503 },
  { n: 19, dark: false, seed: 1904 }, { n: 21, dark: false, seed: 2105 }, { n: 23, dark: false, seed: 2306 },
  { n: 27, dark: false, seed: 2707 }, { n: 31, dark: false, seed: 3108 },
  { n: 21, dark: true,  seed: 2109 }, { n: 31, dark: true,  seed: 3110 }
];
const TIER = i => i < 3 ? '쉬움' : i < 6 ? '보통' : i < 8 ? '어려움' : '최종 보스';

function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function genMaze(n, rnd) {                       // 재귀 백트래킹
  const g = new Uint8Array(n * n).fill(1);
  const stack = [[1, 1]]; g[n + 1] = 0;
  const dirs = [[2, 0], [-2, 0], [0, 2], [0, -2]];
  while (stack.length) {
    const [x, y] = stack[stack.length - 1];
    const opts = dirs.filter(([dx, dy]) => {
      const nx = x + dx, ny = y + dy;
      return nx > 0 && ny > 0 && nx < n - 1 && ny < n - 1 && g[ny * n + nx] === 1;
    });
    if (!opts.length) { stack.pop(); continue; }
    const [dx, dy] = opts[Math.floor(rnd() * opts.length)];
    g[(y + dy / 2) * n + (x + dx / 2)] = 0;
    g[(y + dy) * n + (x + dx)] = 0;
    stack.push([x + dx, y + dy]);
  }
  return g;
}
function shortestLen(g, n) {                      // 최단 경로 칸 수 (BFS)
  const start = n + 1, goal = (n - 2) * n + (n - 2), dist = new Int32Array(n * n).fill(-1), q = [start];
  dist[start] = 0;
  for (let h = 0; h < q.length; h++) {
    const c = q[h]; if (c === goal) break;
    const x = c % n, y = (c / n) | 0;
    [[1, 0], [-1, 0], [0, 1], [0, -1]].forEach(([dx, dy]) => {
      const nx = x + dx, ny = y + dy, ni = ny * n + nx;
      if (nx >= 0 && ny >= 0 && nx < n && ny < n && g[ni] === 0 && dist[ni] < 0) { dist[ni] = dist[c] + 1; q.push(ni); }
    });
  }
  return dist[goal];
}

/* ---------- 상태 ---------- */
const $ = id => document.getElementById(id);
const C = { wall: '#2e1a5e', floor: '#ede9fe', start: '#22c55e', goal: '#ef4444', trail: '#a7f3d0', me: '#f97316',
            fog: '#05030d', fogTrail: '#233a3a' };
const WALL_RATIO = 0.3;
const cv = $('cv'), ctx = cv.getContext('2d');
let quest = 1, N = 21, PX = 26, OX = [], SZ = [], grid, trail, pos, moves, shortest, t3 = 0, t2 = 0;
let running = false, finished = false, dark = false, demo = false;
let t0 = 0, elapsed = 0, rafId = 0, lastResult = null, submitted = false;
let progress = { stars: {}, best: {} };
try { progress = Object.assign(progress, JSON.parse(localStorage.getItem('maze-dash') || '{}')); } catch (e) {}
const saveProgress = () => { try { localStorage.setItem('maze-dash', JSON.stringify(progress)); } catch (e) {} };
const START = () => N + 1, GOAL = () => (N - 2) * N + (N - 2);
const fmt = ms => (ms / 1000).toFixed(2);
const starStr = k => '★'.repeat(k) + '☆'.repeat(3 - k);
const unlocked = q => demo || q === 1 || (progress.stars[q - 1] || 0) >= 1;

/* ---------- 그리기 (벽은 얇게, 길은 넓게) ---------- */
function visible(i) {
  if (!dark) return true;
  const dx = (i % N) - (pos % N), dy = ((i / N) | 0) - ((pos / N) | 0);
  return dx * dx + dy * dy <= 10;
}
function base(i) {
  if (!visible(i)) return trail[i] ? C.fogTrail : C.fog;
  if (grid[i]) return C.wall;
  return trail[i] ? C.trail : C.floor;
}
function dotAt(i, color) {
  const cx = i % N, cy = (i / N) | 0;
  ctx.fillStyle = color; ctx.beginPath();
  ctx.arc(OX[cx] + SZ[cx] / 2, OX[cy] + SZ[cy] / 2, PX * 0.37, 0, Math.PI * 2); ctx.fill();
}
function paint(i) {
  const cx = i % N, cy = (i / N) | 0;
  ctx.fillStyle = base(i); ctx.fillRect(OX[cx], OX[cy], SZ[cx], SZ[cy]);
  if (visible(i)) { if (i === GOAL()) dotAt(i, C.goal); else if (i === START()) dotAt(i, C.start); }
}
function paintAll() { for (let i = 0; i < N * N; i++) paint(i); dotAt(pos, C.me); }
function paintAround(p, r) {
  const px = p % N, py = (p / N) | 0;
  for (let y = Math.max(0, py - r); y <= Math.min(N - 1, py + r); y++)
    for (let x = Math.max(0, px - r); x <= Math.min(N - 1, px + r); x++) paint(y * N + x);
  dotAt(pos, C.me);
}

/* ---------- 퀘스트 바 ---------- */
function renderQuests() {
  $('quests').innerHTML = QUESTS.map((c, i) => {
    const q = i + 1, ok = unlocked(q), s = progress.stars[q] || 0;
    return `<button class="qb${q === quest ? ' on' : ''}${ok ? '' : ' lock'}${c.dark ? ' dk' : ''}" data-q="${q}">
      <b>${ok ? q : '🔒'}</b><small>${ok ? starStr(s) : '&nbsp;'}</small></button>`;
  }).join('');
  $('quests').querySelectorAll('.qb').forEach(b => b.onclick = () => {
    const q = +b.dataset.q;
    if (running || !unlocked(q)) return;
    quest = q; newMaze();
  });
}

function newMaze() {
  cancelAnimationFrame(rafId);
  running = false; finished = false; submitted = false; lastResult = null;
  const cfg = QUESTS[quest - 1];
  N = cfg.n; dark = cfg.dark;
  grid = genMaze(N, mulberry32(cfg.seed)); trail = new Uint8Array(N * N);
  const rooms = (N - 1) / 2, walls = (N + 1) / 2;
  PX = Math.floor(560 / (rooms + walls * WALL_RATIO));
  const W = Math.max(3, Math.round(PX * WALL_RATIO));
  OX = []; SZ = []; let acc = 0;
  for (let k = 0; k < N; k++) { SZ[k] = k % 2 === 1 ? PX : W; OX[k] = acc; acc += SZ[k]; }
  cv.width = cv.height = acc;
  pos = START(); moves = 0; elapsed = 0;
  shortest = shortestLen(grid, N);
  const mul = dark ? 1.6 : 1;                    // 별 기준 시간: 최단 경로 × 0.25초(★★★) / 0.5초(★★)
  t3 = Math.round(shortest * 0.25 * mul); t2 = Math.round(shortest * 0.5 * mul);
  $('timer').textContent = '0.00'; $('myMoves').textContent = 0;
  $('shortest').textContent = `(최단 ${shortest}칸)`;
  $('qinfo').textContent = `QUEST ${quest} · ${TIER(quest - 1)}${dark ? ' · 🌙 Dark Mode' : ''} · ${(N - 1) / 2}×${(N - 1) / 2}`;
  $('goal').textContent = `🎯 ★★★ ${t3}초 이내 · ★★ ${t2}초 이내`;
  const myBest = progress.best[quest];
  $('best').textContent = myBest ? `내 최고 기록 ${fmt(myBest)}초 ${starStr(progress.stars[quest] || 1)}` : '';
  $('status').textContent = 'START를 누르면 타이머가 시작돼요.';
  $('startBtn').textContent = 'START'; $('startBtn').disabled = false;
  $('nextBtn').style.display = 'none';
  $('reg').classList.remove('show');
  paintAll(); renderQuests(); loadTop();
}

/* ---------- 진행 ---------- */
function loop() {
  if (!running) return;
  elapsed = performance.now() - t0;
  $('timer').textContent = fmt(elapsed);
  rafId = requestAnimationFrame(loop);
}

function move(dx, dy) {
  if (!running) return;
  const x = pos % N + dx, y = ((pos / N) | 0) + dy;
  if (x < 0 || y < 0 || x >= N || y >= N || grid[y * N + x] !== 0) return;
  const old = pos; trail[old] = 1; pos = y * N + x; moves++;
  $('myMoves').textContent = moves;
  const r = dark ? 4 : 1; paintAround(old, r); paintAround(pos, r);
  if (pos === GOAL()) win();
}

function win() {
  running = false; finished = true; cancelAnimationFrame(rafId);
  elapsed = performance.now() - t0;
  const ms = Math.round(elapsed), sec = ms / 1000;
  $('timer').textContent = fmt(ms);
  paintAll();
  const stars = sec <= t3 ? 3 : sec <= t2 ? 2 : 1;
  const before = progress.best[quest];
  progress.stars[quest] = Math.max(progress.stars[quest] || 0, stars);
  if (!before || ms < before) progress.best[quest] = ms;
  saveProgress();
  lastResult = { quest, moves, time_ms: ms };
  const allClear = QUESTS.every((_, i) => (progress.stars[i + 1] || 0) >= 1);
  $('status').textContent = quest === 10 && allClear
    ? `🏆 ALL CLEAR! ${starStr(stars)}`
    : `🎉 CLEAR! ${fmt(ms)}초 ${starStr(stars)}`;
  $('best').textContent = `내 최고 기록 ${fmt(progress.best[quest])}초 ${starStr(progress.stars[quest])}`;
  $('startBtn').textContent = 'RETRY'; $('startBtn').disabled = false;
  $('nextBtn').style.display = quest < QUESTS.length ? 'inline-block' : 'none';
  $('reg').classList.add('show');
  $('regBtn').disabled = false; $('regMsg').textContent = '';
  if (location.protocol === 'file:') $('regMsg').textContent = '서버에 접속했을 때만 기록을 등록할 수 있어요.';
  try { $('nick').value = localStorage.getItem('nick') || ''; } catch (e) {}
  renderQuests(); confetti(stars === 3 ? 220 : 120);
}

/* ---------- 색종이 ---------- */
function confetti(count) {
  const c = $('confetti'), g = c.getContext('2d');
  c.width = innerWidth; c.height = innerHeight;
  const cols = ['#22d3ee', '#e879f9', '#facc15', '#f97316', '#4ade80', '#fff'];
  const ps = Array.from({ length: count }, () => ({
    x: innerWidth / 2 + (Math.random() - .5) * 200, y: innerHeight * 0.45,
    vx: (Math.random() - .5) * 14, vy: -Math.random() * 14 - 4,
    s: 5 + Math.random() * 6, r: Math.random() * 6, vr: (Math.random() - .5) * .4, c: cols[(Math.random() * cols.length) | 0]
  }));
  let f = 0;
  (function tick() {
    g.clearRect(0, 0, c.width, c.height);
    ps.forEach(p => {
      p.vy += .35; p.x += p.vx; p.y += p.vy; p.r += p.vr;
      g.save(); g.translate(p.x, p.y); g.rotate(p.r); g.fillStyle = p.c; g.fillRect(-p.s / 2, -p.s / 2, p.s, p.s * .6); g.restore();
    });
    if (++f < 150) requestAnimationFrame(tick); else g.clearRect(0, 0, c.width, c.height);
  })();
}

/* ---------- 랭킹 ---------- */
let topText = '';
function loadTop() {
  topText = '';
  if (location.protocol === 'file:') return;
  fetch(`/api/ranking?quest=${quest}`).then(r => r.json()).then(d => {
    const t = d.top && d.top[0];
    $('goal').textContent = `🎯 ★★★ ${t3}초 이내 · ★★ ${t2}초 이내` + (t ? `  |  🥇 ${t.nickname} ${fmt(t.time_ms)}초` : '  |  아직 1등이 없어요!');
  }).catch(() => {});
}
$('regBtn').onclick = () => {
  if (!lastResult || submitted) return;
  const nickname = $('nick').value.trim();
  if (!nickname) { $('regMsg').textContent = '닉네임을 입력해 주세요.'; return; }
  try { localStorage.setItem('nick', nickname); } catch (e) {}
  $('regBtn').disabled = true;
  fetch('/api/records', { method: 'POST', headers: { 'Content-Type': 'application/json' },
                          body: JSON.stringify({ nickname, ...lastResult }) })
    .then(r => r.ok ? r.json() : Promise.reject())
    .then(d => { submitted = true; $('regMsg').textContent = `등록 완료! Quest ${lastResult.quest} 현재 ${d.rank}위 🏆`; loadTop(); })
    .catch(() => { $('regBtn').disabled = false; $('regMsg').textContent = '등록에 실패했어요. 다시 눌러 주세요.'; });
};

/* ---------- 입력: 방향키 ---------- */
const KEYMAP = { ArrowLeft: [-1, 0], ArrowDown: [0, 1], ArrowUp: [0, -1], ArrowRight: [1, 0] };
const keyEl = {}; document.querySelectorAll('.key').forEach(el => { keyEl[el.dataset.code] = el; });
document.addEventListener('keydown', e => {
  if (e.key === 'Enter') {                                  // Enter: 시작 / 다시 시작 (닉네임 입력 중에는 등록)
    if (e.target.id === 'nick') { e.preventDefault(); $('regBtn').click(); return; }
    e.preventDefault(); if (!running) $('startBtn').click(); return;
  }
  if (e.target.tagName === 'INPUT' && e.target.type !== 'checkbox') return;
  const d = KEYMAP[e.code]; if (!d) return;
  e.preventDefault(); move(d[0], d[1]);
  keyEl[e.code].classList.add('press');
});
document.addEventListener('keyup', e => { if (keyEl[e.code]) keyEl[e.code].classList.remove('press'); });
document.querySelectorAll('.key').forEach(el => {
  let t = null; const go = () => move(+el.dataset.dx, +el.dataset.dy);
  const stop = () => { clearInterval(t); t = null; el.classList.remove('press'); };
  el.addEventListener('pointerdown', e => { e.preventDefault(); el.classList.add('press'); go(); clearInterval(t); t = setInterval(go, 120); });
  ['pointerup', 'pointerleave', 'pointercancel'].forEach(ev => el.addEventListener(ev, stop));
});

/* ---------- 버튼 ---------- */
$('startBtn').onclick = () => {
  if (running) return;
  if (finished) newMaze();                       // RETRY: 같은 퀘스트(같은 미로)를 처음부터
  running = true; t0 = performance.now();
  $('status').textContent = 'GO! 방향키로 이동!';
  $('startBtn').textContent = 'RUNNING...'; $('startBtn').disabled = true;
  $('nextBtn').style.display = 'none'; $('reg').classList.remove('show');
  document.activeElement && document.activeElement.blur();
  rafId = requestAnimationFrame(loop);
};
$('nextBtn').onclick = () => { if (quest < QUESTS.length) { quest++; newMaze(); } };
$('resetBtn').onclick = e => {
  e.preventDefault();
  if (running) return;
  if (!confirm('이 브라우저에 저장된 퀘스트 진행 상황(별, 내 최고 기록)을 모두 지울까요?\n랭킹 기록은 지워지지 않아요.')) return;
  progress = { stars: {}, best: {} }; saveProgress();
  quest = 1; newMaze();
};
$('demo').onchange = e => { demo = e.target.checked; renderQuests(); };
newMaze();
</script>
